name: Deploy homepage to Pages

# website-template 을 검사하고 페이지를 만들어 GitHub Pages 에 올립니다.

on:
  # 작업 브랜치 push 로는 공개 배포되지 않습니다. main 에 합친 뒤 또는 수동 실행으로만 배포합니다.
  push:
    branches: [main]
    paths:
      - "website-template/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 설정 검사
        working-directory: website-template
        run: python scripts/validate.py
      - name: 페이지 만들기
        working-directory: website-template
        run: python scripts/generate.py --out dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website-template/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
