name: Deploy builder to Pages

# 빌더(builder/index.html)만 GitHub Pages 에 올립니다.
# 샘플 홈페이지(website-template)는 공개하지 않습니다.
# 작업 브랜치 push 로는 공개 배포되지 않습니다. main 에 합친 뒤 또는 수동 실행으로만 배포합니다.

on:
  push:
    branches: [main]
    paths:
      - "builder/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 빌더 페이지 준비
        run: |
          mkdir -p site/builder
          cp builder/index.html site/builder/index.html
          test -f site/builder/index.html
          printf '%s\n' \
            '<!doctype html>' \
            '<html lang="ko"><head><meta charset="utf-8">' \
            '<meta name="robots" content="noindex">' \
            '<meta http-equiv="refresh" content="0; url=builder/">' \
            '<title>바이브 홈페이지 빌더</title></head>' \
            '<body><p><a href="builder/">바이브 홈페이지 빌더 열기</a></p></body></html>' \
            > site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
