<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나의 홈페이지</title>
  <style>
  :root { color-scheme: light dark; --accent: #3b82f6; }
  body { margin: 0; font-family: system-ui, sans-serif; line-height: 1.6; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  header h1 { margin-bottom: 0; }
  .subtitle { color: #64748b; margin-top: 4px; }
  article { border-left: 4px solid var(--accent); padding: 4px 12px; margin: 20px 0; }
  article h2 { margin: 0; font-size: 1.15rem; }
  article h2 a { color: inherit; }
  .date { color: #64748b; font-size: 0.9rem; }
  footer { color: #64748b; font-size: 0.85rem; margin: 40px 0 16px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>나의 홈페이지</h1>
    <p class="subtitle">이 페이지는 data/site.json 을 수정하면 자동으로 갱신됩니다.</p>
  </header>
  <article>
    <h2>두 번째 소식</h2>
    <p class="date">2026-10-15</p>
    <p>새로운 콘텐츠를 추가할 때는 items 목록에 항목을 넣으세요.</p>
  </article>
  <article>
    <h2><a href="https://example.com/news/1">첫 번째 소식</a></h2>
    <p class="date">2026-10-01</p>
    <p>홈페이지 자동 업데이트를 시작했습니다.</p>
  </article>
  <footer>마지막 자동 업데이트: 2026-10-21 10:12 (KST)</footer>
</main>
</body>
</html>
