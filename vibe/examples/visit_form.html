<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>방문 신청 페이지</title>
  <style>
    :root { color-scheme: light dark; --accent: #2563eb; --err: #b91c1c; --muted: #64748b; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; line-height: 1.6; background: #ffffff; color: #0f172a; }
    main { max-width: 560px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.5rem; margin: 12px 0 4px; }
    .goal { color: var(--muted); margin: 0 0 16px; }
    .field { margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 9px; font: inherit; border: 1px solid #94a3b8; border-radius: 6px; background: #ffffff; color: #0f172a; }
    input:focus, select:focus, textarea:focus, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .err { color: var(--err); font-size: 0.9rem; margin: 4px 0 0; min-height: 0; }
    .err:empty { display: none; }
    button { padding: 10px 18px; font: inherit; font-weight: 700; border: 0; border-radius: 6px; background: var(--accent); color: #ffffff; cursor: pointer; }
    .rules { color: var(--muted); font-size: 0.9rem; padding-left: 18px; }
    dl { margin: 12px 0; }
    dt { font-weight: 600; margin-top: 8px; }
    dd { margin: 2px 0 0 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <section id="form-view">
    <h1>방문 신청 페이지</h1>
    <p class="goal">방문을 원하는 사람이 날짜와 인원을 적어 신청하고, 신청이 접수되었다는 안내를 보는 페이지입니다.</p>
    <form id="form" novalidate>
    <div class="field"><label for="f1">이름 *</label>
      <input type="text" id="f1" name="f1" aria-describedby="f1-err" required>
      <p class="err" id="f1-err" role="alert"></p></div>
    <div class="field"><label for="f2">연락 이메일 *</label>
      <input type="email" id="f2" name="f2" aria-describedby="f2-err" required>
      <p class="err" id="f2-err" role="alert"></p></div>
    <div class="field"><label for="f3">연락처</label>
      <input type="tel" id="f3" name="f3" aria-describedby="f3-err">
      <p class="err" id="f3-err" role="alert"></p></div>
    <div class="field"><label for="f4">방문 날짜 *</label>
      <input type="date" id="f4" name="f4" aria-describedby="f4-err" required>
      <p class="err" id="f4-err" role="alert"></p></div>
    <div class="field"><label for="f5">방문 인원 *</label>
      <input type="number" id="f5" name="f5" aria-describedby="f5-err" required min="1" max="20">
      <p class="err" id="f5-err" role="alert"></p></div>
    <div class="field"><label for="f6">방문 목적 *</label>
      <select id="f6" name="f6" aria-describedby="f6-err" required><option value="">선택하세요</option><option value="상담">상담</option><option value="견학">견학</option><option value="기타">기타</option></select>
      <p class="err" id="f6-err" role="alert"></p></div>
    <div class="field"><label for="f7">요청 사항</label>
      <textarea id="f7" name="f7" aria-describedby="f7-err" rows="3"></textarea>
      <p class="err" id="f7-err" role="alert"></p></div>
      <button type="submit">제출</button>
    </form>
    <ul class="rules"><li>방문 날짜는 오늘보다 이전으로 고를 수 없습니다.</li><li>방문 인원은 1명 이상 20명 이하여야 합니다.</li><li>필수 입력이 비어 있으면 제출 버튼을 누를 때 빨간 안내 문구를 보여 줍니다.</li><li>제출하면 &#x27;접수 완료&#x27; 화면으로 이동하고, 입력한 이름과 방문 날짜를 함께 보여 줍니다.</li></ul>
  </section>

  <section id="done-view" hidden>
    <h1>접수 완료</h1>
    <p class="goal">제출되었습니다. 입력한 내용은 이 브라우저 화면에서만 보입니다.</p>
    <dl id="summary"></dl>
    <button type="button" id="again">다시 입력</button>
  </section>
</main>

<script>
  const FIELDS = [{"id": "f1", "label": "이름", "type": "text", "required": true, "options": [], "min": null, "max": null, "minToday": false}, {"id": "f2", "label": "연락 이메일", "type": "email", "required": true, "options": [], "min": null, "max": null, "minToday": false}, {"id": "f3", "label": "연락처", "type": "phone", "required": false, "options": [], "min": null, "max": null, "minToday": false}, {"id": "f4", "label": "방문 날짜", "type": "date", "required": true, "options": [], "min": null, "max": null, "minToday": true}, {"id": "f5", "label": "방문 인원", "type": "number", "required": true, "options": [], "min": 1, "max": 20, "minToday": false}, {"id": "f6", "label": "방문 목적", "type": "select", "required": true, "options": ["상담", "견학", "기타"], "min": null, "max": null, "minToday": false}, {"id": "f7", "label": "요청 사항", "type": "textarea", "required": false, "options": [], "min": null, "max": null, "minToday": false}];
  const form = document.getElementById("form");
  const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const PHONE = /^[0-9+\-() ]{7,20}$/;
  const DATE = /^\d{4}-\d{2}-\d{2}$/;

  function todayIso() {
    const d = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  function messageFor(field, raw) {
    const value = raw.trim();
    if (!value) return field.required ? "필수 입력입니다." : "";
    if (field.type === "email" && !EMAIL.test(value)) return "이메일 형식이 올바르지 않습니다.";
    if (field.type === "phone" && !PHONE.test(value)) return "전화번호 형식이 올바르지 않습니다. 숫자와 하이픈을 사용해 주세요.";
    if (field.type === "date") {
      if (!DATE.test(value)) return "날짜는 YYYY-MM-DD 형식으로 입력해 주세요.";
      if (field.minToday && value < todayIso()) return "오늘보다 이전 날짜는 고를 수 없습니다.";
    }
    if (field.type === "number") {
      const n = Number(value);
      if (Number.isNaN(n)) return "숫자를 입력해 주세요.";
      if (field.min !== null && n < field.min) return `${field.min} 이상이어야 합니다.`;
      if (field.max !== null && n > field.max) return `${field.max} 이하여야 합니다.`;
    }
    return "";
  }

  function valueOf(el) {
    return el.value;
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    let firstInvalid = null;
    for (const field of FIELDS) {
      const el = document.getElementById(field.id);
      const message = messageFor(field, valueOf(el));
      document.getElementById(field.id + "-err").textContent = message;
      el.setAttribute("aria-invalid", message ? "true" : "false");
      if (message && !firstInvalid) firstInvalid = el;
    }
    if (firstInvalid) {
      firstInvalid.focus();
      return;
    }
    showSummary();
  });

  function showSummary() {
    const summary = document.getElementById("summary");
    summary.replaceChildren();
    for (const field of FIELDS) {
      const value = valueOf(document.getElementById(field.id)).trim();
      const dt = document.createElement("dt");
      dt.textContent = field.label;
      const dd = document.createElement("dd");
      dd.textContent = value || "-";
      summary.append(dt, dd);
    }
    document.getElementById("form-view").hidden = true;
    document.getElementById("done-view").hidden = false;
    document.getElementById("done-view").querySelector("h1").focus?.();
  }

  document.getElementById("again").addEventListener("click", () => {
    form.reset();
    document.querySelectorAll(".err").forEach((el) => { el.textContent = ""; });
    document.getElementById("done-view").hidden = true;
    document.getElementById("form-view").hidden = false;
  });
</script>
</body>
</html>
