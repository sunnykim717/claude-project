<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>홈페이지 편집기</title>
  <style>
    :root { --accent: #2563eb; --bg: #f8fafc; --panel: #ffffff; --text: #0f172a; --muted: #64748b; --line: #e2e8f0; --ok: #15803d; --err: #b91c1c; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
    header { padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }
    h1 { font-size: 1.1rem; margin: 0; }
    .layout { display: grid; grid-template-columns: minmax(300px, 420px) 1fr; min-height: calc(100vh - 56px); }
    aside { background: var(--panel); border-right: 1px solid var(--line); padding: 12px; overflow-y: auto; max-height: calc(100vh - 56px); }
    section.panel { margin-bottom: 16px; }
    h2 { font-size: 0.95rem; margin: 0 0 8px; }
    textarea, input, select { width: 100%; font: inherit; padding: 8px; border: 1px solid #94a3b8; border-radius: 6px; background: #fff; color: var(--text); }
    textarea { min-height: 64px; font-family: ui-monospace, monospace; font-size: 0.9rem; }
    button { font: inherit; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; font-weight: 600; }
    button.secondary { background: #fff; color: var(--accent); }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
    .examples button { font-weight: 500; font-size: 0.85rem; padding: 6px 8px; }
    .log { font-size: 0.9rem; white-space: pre-line; padding: 8px; border-radius: 6px; background: #f1f5f9; min-height: 3em; }
    .log.ok { color: var(--ok); }
    .log.err { color: var(--err); }
    .hint { color: var(--muted); font-size: 0.85rem; }
    .preview { padding: 12px; min-width: 0; }
    .preview iframe { width: 100%; height: calc(100vh - 150px); min-height: 420px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } aside { max-height: none; border-right: 0; } .preview iframe { height: 70vh; } }
  </style>
</head>
<body>
<header>
  <h1>홈페이지 편집기 (설치 없이, 명령어 입력 없이)</h1>
  <div class="row">
    <button type="button" class="secondary" id="btn-import">설정 불러오기</button>
    <input type="file" id="file-import" accept="application/json,.json" hidden>
    <button type="button" class="secondary" id="btn-export">설정 저장 (파일)</button>
    <button type="button" id="btn-project">프로젝트 내려받기 (zip)</button>
    <button type="button" class="secondary" id="btn-photo">첫 화면 사진 올리기</button>
    <input type="file" id="file-photo" accept="image/*" hidden>
    <button type="button" class="secondary" id="btn-reset">처음 상태로</button>
  </div>
</header>

<div class="layout">
  <aside>
    <section class="panel">
      <h2>명령 입력</h2>
      <p class="hint">명령을 적고 Enter 를 누르거나 <b>실행</b> 을 누르세요. 아래 버튼을 누르면 명령이 채워집니다.</p>
      <textarea id="command" placeholder="예: set site.name 민수의 작업실"></textarea>
      <div class="row"><button type="button" id="btn-run">실행</button><button type="button" class="secondary" id="btn-help">도움말</button></div>
      <div class="log" id="log" role="status" aria-live="polite">준비되었습니다. 도움말을 누르면 명령 목록을 볼 수 있습니다.</div>
    </section>

    <section class="panel examples">
      <h2>자주 쓰는 명령</h2>
      <div class="row" id="examples"></div>
    </section>

    <section class="panel">
      <h2>디자인 고르기</h2>
      <div class="row">
        <select id="design-select" aria-label="디자인 선택"></select>
        <button type="button" id="btn-design">적용</button>
      </div>
    </section>

    <section class="panel">
      <h2>페이지 파일 받기</h2>
      <p class="hint">받은 파일을 GitHub 저장소의 같은 폴더에 올리면 자동으로 배포됩니다.</p>
      <div class="row" id="downloads"></div>
    </section>
  </aside>

  <section class="preview">
    <div class="row">
      <select id="page-select" aria-label="보기 페이지"></select>
    </div>
    <iframe id="frame" title="미리보기"></iframe>
  </section>
</div>

<script>
/*
 * 홈페이지 엔진 (브라우저와 Node 에서 같이 씁니다). scripts/validate.py 와 scripts/generate.py 를 옮긴 것입니다.
 * 같은 입력에 대해 Python 결과와 글자 단위로 같아야 합니다 (tests/test_editor_parity.py 가 확인합니다).
 *
 * 입력: files = { "config/site.json": "<파일 글자>", ... }  (파일 이름은 템플릿과 같습니다)
 */
(function (root) {
  "use strict";

  // 설정 항목 목록은 schema.json 에서만 옵니다. useSchema() 로 한 번 넣어 주세요.
  var loaded = false;
  var PAGE_FILES, FILES, ALLOWED_FONTS, FONT_STACK, SPACINGS, SPACING_PX, LAYOUTS, LANGUAGES, IMAGE;
  var HEX = /^#[0-9a-fA-F]{6}$/;
  var EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  var DATE = /^\d{4}-\d{2}-\d{2}$/;

  function useSchema(schema) {
    PAGE_FILES = schema.pages;
    FILES = schema.files;
    FONT_STACK = schema.fonts;
    ALLOWED_FONTS = Object.keys(schema.fonts);
    SPACING_PX = schema.spacings;
    SPACINGS = Object.keys(schema.spacings);
    LAYOUTS = schema.layouts;
    LANGUAGES = schema.languages;
    IMAGE = new RegExp("^/images/[A-Za-z0-9._-]+\\.(" + schema.image_extensions.join("|") + ")$");
    loaded = true;
  }

  function requireSchema() {
    if (!loaded) throw new Error("schema.json 을 먼저 useSchema() 로 넣어 주세요.");
  }

  // Python html.escape(value, quote=True) 와 같은 규칙
  function esc(value) {
    var s = value === null || value === undefined ? "" : String(value);
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#x27;");
  }

  function isObject(v) { return v !== null && typeof v === "object" && !Array.isArray(v); }
  function isInt(v) { return typeof v === "number" && Number.isInteger(v); }
  function str(v) { return v === null || v === undefined ? "" : String(v); }
  function strip(v) { return str(v).trim(); }
  function startsWith(s, prefix) { return s.slice(0, prefix.length) === prefix; }

  // 파이썬 str.strip() 과 같은 규칙 (공백 문자)
  function pyStrip(v) { return str(v).replace(/^\s+|\s+$/g, ""); }

  function isLinkOk(value) {
    return startsWith(value, "https://") || startsWith(value, "http://") || Object.prototype.hasOwnProperty.call(PAGE_FILES, value);
  }

  function checkItems(errors, rel, label, items) {
    if (!Array.isArray(items)) {
      errors.push(rel + ": 목록이어야 합니다.");
      return;
    }
    items.forEach(function (item, i) {
      var n = i + 1;
      if (!isObject(item) || !item.title) {
        errors.push(rel + " " + n + "번 " + label + ": title 이 필요합니다.");
        return;
      }
      if (item.date && !DATE.test(str(item.date))) errors.push(rel + " " + n + "번 " + label + ": date 는 YYYY-MM-DD 형식이어야 합니다.");
      if (item.url && !(startsWith(str(item.url), "https://") || startsWith(str(item.url), "http://"))) {
        errors.push(rel + " " + n + "번 " + label + ": url 은 https:// 로 시작해야 합니다.");
      }
    });
  }

  function validate(files) {
    requireSchema();
    var errors = [];
    var data = {};
    Object.keys(FILES).forEach(function (key) {
      var rel = FILES[key];
      var text = files[rel];
      if (text === undefined || text === null) {
        errors.push(rel + " 파일이 없습니다.");
        data[key] = null;
        return;
      }
      try {
        data[key] = JSON.parse(text);
      } catch (e) {
        errors.push(rel + " 의 JSON 형식이 올바르지 않습니다.");
        data[key] = null;
      }
    });

    var site = data.site, nav = data.nav, theme = data.theme;
    if (isObject(site)) {
      ["name", "language"].forEach(function (key) {
        if (!pyStrip(site[key])) errors.push("config/site.json: '" + key + "' 을 적어 주세요.");
      });
      if (LANGUAGES.indexOf(site.language) === -1) {
        errors.push("config/site.json: language 은 ko, en, ja 중 하나여야 합니다.");
      }
    } else if (site !== null) {
      errors.push("config/site.json: 최상위 값은 { } 묶음이어야 합니다.");
    }

    if (Array.isArray(nav)) {
      nav.forEach(function (entry, i) {
        var n = i + 1;
        if (!isObject(entry) || !entry.label) {
          errors.push("config/navigation.json " + n + "번: label 이 필요합니다.");
        } else if (!Object.prototype.hasOwnProperty.call(PAGE_FILES, entry.path)) {
          errors.push("config/navigation.json " + n + "번: 알 수 없는 페이지 주소입니다 (" + str(entry.path) + ").");
        }
      });
    } else if (nav !== null) {
      errors.push("config/navigation.json: 목록이어야 합니다.");
    }

    if (isObject(theme)) {
      ["primaryColor", "backgroundColor", "textColor"].forEach(function (key) {
        if (!HEX.test(str(theme[key]))) errors.push("config/theme.json: " + key + " 는 #RRGGBB 형식이어야 합니다.");
      });
      if (ALLOWED_FONTS.indexOf(theme.font) === -1) {
        errors.push("config/theme.json: font 은 " + ALLOWED_FONTS.slice().sort().join(", ") + " 중 하나여야 합니다.");
      }
      var radius = theme.radius;
      if (!isInt(radius) || radius < 0 || radius > 32) errors.push("config/theme.json: radius 는 0~32 사이의 정수여야 합니다.");
      if (SPACINGS.indexOf(theme.spacing) === -1) errors.push("config/theme.json: spacing 은 compact, normal, airy 중 하나여야 합니다.");
      if (LAYOUTS.indexOf(theme.layout) === -1) errors.push("config/theme.json: layout 은 classic, modern, card, minimal 중 하나여야 합니다.");
    }

    var home = data.home;
    if (isObject(home)) {
      var hero = isObject(home.hero) ? home.hero : {};
      if (!hero.title) errors.push("content/home.json: hero.title 을 적어 주세요.");
      if (hero.image) {
        var image = str(hero.image);
        if (!IMAGE.test(image)) {
          errors.push("content/home.json: image 는 /images/파일이름.jpg (png, webp, gif) 형식이어야 합니다.");
        } else if (!(("public/" + image.replace(/^\/+/, "")) in files)) {
          errors.push("content/home.json: 사진 파일이 public 폴더에 없습니다 (" + image + ").");
        }
      }
      if (hero.buttonLink && !isLinkOk(str(hero.buttonLink))) {
        errors.push("content/home.json: buttonLink 은 https:// 주소 또는 페이지 주소여야 합니다 (" + hero.buttonLink + ").");
      }
    }

    var projects = data.projects;
    if (isObject(projects)) checkItems(errors, "content/projects.json", "사업", projects.items);
    var news = data.news;
    if (isObject(news)) checkItems(errors, "content/news.json", "소식", news.items);
    var support = data.support;
    if (isObject(support)) checkItems(errors, "content/support.json", "후원 방법", support.ways);
    var transparency = data.transparency;
    if (isObject(transparency)) checkItems(errors, "content/transparency.json", "자료", transparency.reports);
    var volunteer = data.volunteer;
    if (isObject(volunteer)) checkItems(errors, "content/volunteer.json", "활동", volunteer.positions);
    var privacy = data.privacy;
    if (isObject(privacy)) checkItems(errors, "content/privacy.json", "항목", privacy.items);

    var contact = data.contact;
    if (isObject(contact)) {
      if (contact.email && !EMAIL.test(str(contact.email))) errors.push("content/contact.json: 이메일 형식이 올바르지 않습니다.");
      var social = isObject(contact.social) ? contact.social : {};
      Object.keys(social).forEach(function (key) {
        var value = str(social[key]);
        if (value && !(startsWith(value, "https://") || startsWith(value, "http://"))) {
          errors.push("content/contact.json: social." + key + " 는 https:// 로 시작해야 합니다.");
        }
      });
    }
    return { data: data, errors: errors };
  }

  // {{이름}} 자리에 값을 넣습니다. 빠진 값이 있으면 오류입니다.
  function fill(template, values) {
    return template.replace(/\{\{(\w+)\}\}/g, function (match, key) {
      if (!Object.prototype.hasOwnProperty.call(values, key)) throw new Error("템플릿에 없는 자리표시자입니다: " + key);
      return values[key];
    });
  }

  function themeCss(theme) {
    return ":root {" +
      " --primary: " + theme.primaryColor + ";" +
      " --bg: " + theme.backgroundColor + ";" +
      " --text: " + theme.textColor + ";" +
      " --font: " + FONT_STACK[theme.font] + ";" +
      " --radius: " + theme.radius + "px;" +
      " --gap: " + SPACING_PX[theme.spacing] + "px;" +
      " --max: 760px;" +
      " }";
  }

  function linkFor(value) {
    if (startsWith(value, "https://") || startsWith(value, "http://")) return value;
    return PAGE_FILES[value];
  }

  function headerHtml(files, site, nav, currentFile) {
    var links = nav.map(function (entry) {
      var target = PAGE_FILES[entry.path];
      var current = target === currentFile ? ' aria-current="page"' : "";
      return '<li><a href="' + esc(target) + '"' + current + ">" + esc(entry.label) + "</a></li>";
    });
    return fill(files["src/components/Header.html"], { brand: esc(site.name), links: links.join("") });
  }

  function heroHtml(files, home) {
    var hero = home.hero;
    var image = "";
    if (hero.image) {
      var src = "public/" + String(hero.image).replace(/^\/+/, "");
      image = '<img class="hero-photo" src="' + esc(src) + '" alt="' + esc(hero.imageAlt) + '">';
    }
    var button = "";
    if (hero.buttonText && hero.buttonLink) {
      button = '<a class="button" href="' + esc(linkFor(hero.buttonLink)) + '">' + esc(hero.buttonText) + "</a>";
    }
    return fill(files["src/components/Hero.html"], {
      image: image, title: esc(hero.title), subtitle: esc(hero.subtitle), button: button
    });
  }

  function footerHtml(files, site, contact) {
    var lines = [];
    if (contact.email) {
      lines.push('<p><a href="' + esc("mailto:" + contact.email) + '">' + esc(contact.email) + "</a></p>");
    }
    var social = isObject(contact.social) ? contact.social : {};
    var names = [["github", "GitHub"], ["instagram", "Instagram"], ["youtube", "YouTube"]];
    var links = names.filter(function (pair) { return social[pair[0]]; }).map(function (pair) {
      return '<li><a href="' + esc(social[pair[0]]) + '">' + pair[1] + "</a></li>";
    });
    if (links.length) lines.push('<ul class="links">' + links.join("") + "</ul>");
    lines.push('<p><a href="privacy.html">개인정보 처리방침</a></p>');
    return fill(files["src/components/Footer.html"], { name: esc(site.name), contact: lines.join("") });
  }

  function itemsHtml(items, layout) {
    var body = projectArticles(items);
    if (layout === "card" && body) return '<div class="cards">' + body + "</div>";
    return body;
  }

  function block(title, bodyHtml) {
    return '<section class="block"><h2>' + esc(title) + "</h2>" + bodyHtml + "</section>";
  }

  // 날짜가 최신인 것이 위로 옵니다. 날짜가 같으면 원래 순서를 지킵니다.
  function projectArticles(items) {
    var ordered = items.map(function (item, index) { return { item: item, index: index }; });
    ordered.sort(function (a, b) {
      var da = str(a.item.date), db = str(b.item.date);
      if (da !== db) return da < db ? 1 : -1;
      return a.index - b.index;
    });
    return ordered.map(function (pair) {
      var item = pair.item;
      var title = esc(item.title);
      if (item.url) title = '<a href="' + esc(item.url) + '">' + title + "</a>";
      var date = item.date ? '<time datetime="' + esc(item.date) + '">' + esc(item.date) + "</time>" : "";
      var summary = item.summary ? "<p>" + esc(item.summary) + "</p>" : "";
      return "<article><h3>" + title + "</h3>" + date + summary + "</article>";
    }).join("");
  }

  function buildPages(files, data) {
    var site = data.site, nav = data.nav, theme = data.theme;
    var style = themeCss(theme) + "\n" + files["src/styles/site.css"];
    var pages = {};

    function page(fileName, title, mainHtml, description) {
      var fullTitle = fileName === "index.html" ? site.name : title + " | " + site.name;
      pages[fileName] = fill(files["src/pages/page.html"], {
        lang: esc(site.language || "ko"),
        title: esc(fullTitle),
        description: esc(site.description),
        style: style,
        header: headerHtml(files, site, nav, fileName),
        main: mainHtml,
        footer: footerHtml(files, site, data.contact),
        layout: esc(theme.layout)
      });
    }

    var home = data.home;
    var previewItems = (data.projects.items || []).slice(0, 3);
    var preview = itemsHtml(previewItems, theme.layout);
    var homeMain = heroHtml(files, home) +
      block("소개", '<p class="pre">' + esc(home.intro) + "</p>") +
      (preview ? block(data.projects.title, preview) : "");
    page("index.html", site.name, homeMain, site.description || "");

    page("about.html", data.about.title,
      block(data.about.title, '<p class="pre">' + esc(data.about.body) + "</p>"), data.about.body);
    page("projects.html", data.projects.title,
      block(data.projects.title, itemsHtml(data.projects.items || [], theme.layout)), data.projects.title);
    var support = data.support;
    var ways = projectArticles(support.ways || []);
    var supportMain = block(support.title, '<p class="pre">' + esc(support.body) + "</p>");
    if (ways) supportMain += block("후원 방법", ways);
    if (support.notice) supportMain += block("안내", '<p class="pre">' + esc(support.notice) + "</p>");
    page("support.html", support.title, supportMain, support.body);
    page("news.html", data.news.title, block(data.news.title, projectArticles(data.news.items || [])), data.news.title);
    var transparency = data.transparency;
    page("transparency.html", transparency.title,
      block(transparency.title, '<p class="pre">' + esc(transparency.body) + "</p>") +
      block("사업 · 재무 자료", projectArticles(transparency.reports || [])) +
      block("사업비 구성", '<p class="pre">' + esc(transparency.costs) + "</p>") +
      block("외부 확인", '<p class="pre">' + esc(transparency.disclosure) + "</p>"),
      transparency.body);
    var volunteer = data.volunteer;
    page("volunteer.html", volunteer.title,
      block(volunteer.title, '<p class="pre">' + esc(volunteer.body) + "</p>") +
      block("활동 종류", projectArticles(volunteer.positions || [])) +
      block("신청 방법", '<p class="pre">' + esc(volunteer.apply) + "</p>"),
      volunteer.body);
    var privacy = data.privacy;
    page("privacy.html", privacy.title,
      block(privacy.title, '<p class="pre">' + esc(privacy.body) + "</p>") +
      block("처리 항목", projectArticles(privacy.items || [])),
      privacy.body);
    page("contact.html", data.contact.title,
      block(data.contact.title, '<p class="pre">' + esc(data.contact.body) + "</p>"), data.contact.body);
    return pages;
  }

  // 검사를 통과하면 페이지 파일 이름과 내용을 돌려줍니다. 틀리면 오류 목록만 돌려줍니다.
  function build(files) {
    requireSchema();
    var checked = validate(files);
    if (checked.errors.length) return { ok: false, errors: checked.errors, pages: {} };
    return { ok: true, errors: [], pages: buildPages(files, checked.data) };
  }

  var api = { useSchema: useSchema, validate: validate, build: build, esc: esc, fill: fill };
  if (typeof module !== "undefined" && module.exports) {
    module.exports = api;
  } else {
    root.SiteEngine = api;
  }
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>
<script>
/*
 * 아주 작은 zip 만들기 (압축 없이 담기). 브라우저와 Node 에서 같이 씁니다.
 * entries: [{ name: "config/site.json", text: "..." }, ...]  -> Uint8Array (zip 파일 내용)
 */
(function (root) {
  "use strict";

  var CRC_TABLE = (function () {
    var table = [];
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
      table[n] = c >>> 0;
    }
    return table;
  })();

  function crc32(bytes) {
    var c = 0xFFFFFFFF;

  "scripts/validate.py": "#!/usr/bin/env python3\n\"\"\"설정과 콘텐츠 파일이 맞는지 검사합니다. 문제는 모아서 한 번에 알려 줍니다.\n\n사용법:\n    python scripts/validate.py\n\"\"\"\n\nimport json\nimport re\nimport sys\nfrom pathlib import Path\n\nROOT = Path(__file__).resolve().parent.parent\nROOT_DIR = Path(__file__).resolve().parent.parent\n# 설정 항목 목록은 schema.json 에서만 관리합니다 (편집기와 도구가 같은 파일을 씁니다)\nSCHEMA = json.loads((ROOT_DIR / \"schema.json\").read_text(encoding=\"utf-8\"))\nPAGE_FILES = SCHEMA[\"pages\"]\nFILES = SCHEMA[\"files\"]\nALLOWED_FONTS = set(SCHEMA[\"fonts\"])\nSPACINGS = set(SCHEMA[\"spacings\"])\nLAYOUTS = set(SCHEMA[\"layouts\"])\nLANGUAGES = set(SCHEMA[\"languages\"])\nHEX = re.compile(r\"^#[0-9a-fA-F]{6}$\")\nIMAGE = re.compile(r\"^/images/[A-Za-z0-9._-]+\\.(\" + \"|\".join(SCHEMA[\"image_extensions\"]) + \")$\")\nEMAIL = re.compile(r\"^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$\")\nDATE = re.compile(r\"^\\d{4}-\\d{2}-\\d{2}$\")\n\n\ndef read_json(root, rel, errors):\n    path = Path(root) / rel\n    try:\n        return json.loads(path.read_text(encoding=\"utf-8\"))\n    except FileNotFoundError:\n        errors.append(f\"{rel} 파일이 없습니다.\")\n    except json.JSONDecodeError as e:\n        errors.append(f\"{rel} 의 JSON 형식이 올바르지 않습니다 ({e.lineno}줄).\")\n    return None\n\n\ndef is_link_ok(value):\n    \"\"\"외부 주소(https)이거나 이 사이트의 페이지 주소만 허용합니다.\"\"\"\n    return value.startswith((\"https://\", \"http://\")) or value in PAGE_FILES\n\n\n\n\ndef load_all(root):\n    \"\"\"모든 설정과 콘텐츠를 읽습니다. (데이터, 오류 목록)을 돌려줍니다.\"\"\"\n    errors = []\n    data = {key: read_json(root, rel, errors) for key, rel in FILES.items()}\n    return data, errors\n\n\ndef check_items(errors, rel, label, items):\n    \"\"\"사업, 소식, 후원 방법처럼 제목과 선택 항목이 있는 목록을 검사합니다.\"\"\"\n    if not isinstance(items, list):\n        errors.append(f\"{rel}: 목록이어야 합니다.\")\n        return\n    for i, item in enumerate(items, start=1):\n        if not isinstance(item, dict) or not item.get(\"title\"):\n            errors.append(f\"{rel} {i}번 {label}: title 이 필요합니다.\")\n            continue\n        if item.get(\"date\") and not DATE.match(item[\"date\"]):\n            errors.append(f\"{rel} {i}번 {label}: date 는 YYYY-MM-DD 형식이어야 합니다.\")\n        if item.get(\"url\") and not item[\"url\"].startswith((\"https://\", \"http://\")):\n            errors.append(f\"{rel} {i}번 {label}: url 은 https:// 로 시작해야 합니다.\")\n\n\ndef validate(root):\n    \"\"\"(데이터, 오류 목록)을 돌려줍니다. 오류가 없으면 목록이 비어 있습니다.\"\"\"\n    data, errors = load_all(root)\n    site, nav, theme = data[\"site\"], data[\"nav\"], data[\"theme\"]\n\n    if isinstance(site, dict):\n        for key in (\"name\", \"language\"):\n            if not str(site.get(key, \"\")).strip():\n                errors.append(f\"config/site.json: '{key}' 을 적어 주세요.\")\n        if site.get(\"language\") not in LANGUAGES:\n            errors.append(\"config/site.json: language 은 ko, en, ja 중 하나여야 합니다.\")\n    elif site is not None:\n        errors.append(\"config/site.json: 최상위 값은 { } 묶음이어야 합니다.\")\n\n    if isinstance(nav, list):\n        for i, entry in enumerate(nav, start=1):\n            if not isinstance(entry, dict) or not entry.get(\"label\"):\n                errors.append(f\"config/navigation.json {i}번: label 이 필요합니다.\")\n            elif entry.get(\"path\") not in PAGE_FILES:\n                errors.append(f\"config/navigation.json {i}번: 알 수 없는 페이지 주소입니다 ({entry.get('path')}).\")\n    elif nav is not None:\n        errors.append(\"config/navigation.json: 목록이어야 합니다.\")\n\n    if isinstance(theme, dict):\n        for key in (\"primaryColor\", \"backgroundColor\", \"textColor\"):\n            if not HEX.match(str(theme.get(key, \"\"))):\n                errors.append(f\"config/theme.json: {key} 는 #RRGGBB 형식이어야 합니다.\")\n        if theme.get(\"font\") not in ALLOWED_FONTS:\n            errors.append(f\"config/theme.json: font 은 {', '.join(sorted(ALLOWED_FONTS))} 중 하나여야 합니다.\")\n        radius = theme.get(\"radius\")\n        if not isinstance(radius, int) or isinstance(radius, bool) or not 0 <= radius <= 32:\n            errors.append(\"config/theme.json: radius 는 0~32 사이의 정수여야 합니다.\")\n        if theme.get(\"spacing\") not in SPACINGS:\n            errors.append(\"config/theme.json: spacing 은 compact, normal, airy 중 하나여야 합니다.\")\n        if theme.get(\"layout\") not in LAYOUTS:\n            errors.append(\"config/theme.json: layout 은 classic, modern, card, minimal 중 하나여야 합니다.\")\n\n    home = data[\"home\"]\n    if isinstance(home, dict):\n        hero = home.get(\"hero\") or {}\n        if not hero.get(\"title\"):\n            errors.append(\"content/home.json: hero.title 을 적어 주세요.\")\n        if hero.get(\"image\"):\n            image = str(hero[\"image\"])\n            if not IMAGE.match(image):\n                errors.append(\"content/home.json: image 는 /images/파일이름.jpg (png, webp, gif) 형식이어야 합니다.\")\n            elif not (Path(root) / \"public\" / image.lstrip(\"/\")).exists():\n                errors.append(f\"content/home.json: 사진 파일이 public 폴더에 없습니다 ({image}).\")\n        if hero.get(\"buttonLink\") and not is_link_ok(hero[\"buttonLink\"]):\n            errors.append(f\"content/home.json: buttonLink 은 https:// 주소 또는 페이지 주소여야 합니다 ({hero['buttonLink']}).\")\n\n    projects = data[\"projects\"]\n    if isinstance(projects, dict):\n        check_items(errors, \"content/projects.json\", \"사업\", projects.get(\"items\", []))\n    news = data[\"news\"]\n    if isinstance(news, dict):\n        check_items(errors, \"content/news.json\", \"소식\", news.get(\"items\", []))\n    support = data[\"support\"]\n    if isinstance(support, dict):\n        check_items(errors, \"content/support.json\", \"후원 방법\", support.get(\"ways\", []))\n    transparency = data[\"transparency\"]\n    if isinstance(transparency, dict):\n        check_items(errors, \"content/transparency.json\", \"자료\", transparency.get(\"reports\", []))\n    volunteer = data[\"volunteer\"]\n    if isinstance(volunteer, dict):\n        check_items(errors, \"content/volunteer.json\", \"활동\", volunteer.get(\"positions\", []))\n    privacy = data[\"privacy\"]\n    if isinstance(privacy, dict):\n        check_items(errors, \"content/privacy.json\", \"항목\", privacy.get(\"items\", []))\n\n    contact = data[\"contact\"]\n    if isinstance(contact, dict):\n        if contact.get(\"email\") and not EMAIL.match(contact[\"email\"]):\n            errors.append(\"content/contact.json: 이메일 형식이 올바르지 않습니다.\")\n        for key, value in (contact.get(\"social\") or {}).items():\n            if value and not value.startswith((\"https://\", \"http://\")):\n                errors.append(f\"content/contact.json: social.{key} 는 https:// 로 시작해야 합니다.\")\n\n    return data, errors\n\n\ndef main(root=ROOT):\n    _, errors = validate(root)\n    if errors:\n        print(\"설정을 고쳐 주세요:\")\n        for e in errors:\n            print(f\"- {e}\")\n        return 1\n    print(\"검사 통과: 설정과 콘텐츠가 맞습니다.\")\n    return 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n",
  "scripts/generate.py": "#!/usr/bin/env python3\n\"\"\"설정과 콘텐츠로 홈페이지 파일을 만들어 dist/ 폴더에 씁니다. Node 도 AI 도 필요 없습니다.\n\n사용법:\n    python scripts/generate.py            # 검사 후 dist/ 에 만들기\n    python scripts/generate.py --out 결과  # 다른 폴더에 만들기\n\n만들어지는 파일: index.html, about.html, projects.html, contact.html 과 public/ 의 그림\n\"\"\"\n\nimport argparse\nimport html\nimport json\nimport re\nimport shutil\nimport sys\nfrom pathlib import Path\n\nHERE = Path(__file__).resolve().parent\nsys.path.insert(0, str(HERE))\nfrom validate import PAGE_FILES, validate  # noqa: E402\n\nROOT = HERE.parent\nSCHEMA = json.loads((ROOT / \"schema.json\").read_text(encoding=\"utf-8\"))\nFONT_STACK = SCHEMA[\"fonts\"]\nSPACING_PX = SCHEMA[\"spacings\"]\nPLACEHOLDER = re.compile(r\"\\{\\{(\\w+)\\}\\}\")\n\n\ndef esc(value):\n    return html.escape(str(value or \"\"), quote=True)\n\n\ndef fill(template, values):\n    \"\"\"{{이름}} 자리에 값을 넣습니다. 값은 이미 안전하게 바뀐 HTML 이어야 합니다. 빠진 값이 있으면 오류입니다.\"\"\"\n    def replace(match):\n        key = match.group(1)\n        if key not in values:\n            raise KeyError(f\"템플릿에 없는 자리표시자입니다: {key}\")\n        return values[key]\n    return PLACEHOLDER.sub(replace, template)\n\n\ndef read_part(root, rel):\n    return (Path(root) / rel).read_text(encoding=\"utf-8\")\n\n\ndef theme_css(theme):\n    \"\"\"theme.json 의 값을 CSS 변수로 바꿉니다.\"\"\"\n    return (\n        \":root {\"\n        f\" --primary: {theme['primaryColor']};\"\n        f\" --bg: {theme['backgroundColor']};\"\n        f\" --text: {theme['textColor']};\"\n        f\" --font: {FONT_STACK[theme['font']]};\"\n        f\" --radius: {theme['radius']}px;\"\n        f\" --gap: {SPACING_PX[theme['spacing']]}px;\"\n        \" --max: 760px;\"\n        \" }\"\n    )\n\n\ndef link_for(value):\n    \"\"\"설정의 주소를 파일 주소로 바꿉니다. https 주소는 그대로 둡니다.\"\"\"\n    if value.startswith((\"https://\", \"http://\")):\n        return value\n    return PAGE_FILES[value]\n\n\ndef header_html(root, site, nav, current_file):\n    links = []\n    for entry in nav:\n        target = PAGE_FILES[entry[\"path\"]]\n        current = ' aria-current=\"page\"' if target == current_file else \"\"\n        links.append(f'<li><a href=\"{esc(target)}\"{current}>{esc(entry[\"label\"])}<\/a><\/li>')\n    return fill(read_part(root, \"src/components/Header.html\"), {\n        \"brand\": esc(site[\"name\"]),\n        \"links\": \"\".join(links),\n    })\n\n\ndef hero_html(root, home):\n    hero = home[\"hero\"]\n    image = \"\"\n    if hero.get(\"image\"):\n        src = \"public/\" + str(hero[\"image\"]).lstrip(\"/\")\n        image = f'<img class=\"hero-photo\" src=\"{esc(src)}\" alt=\"{esc(hero.get(\"imageAlt\"))}\">'\n\n    button = \"\"\n    if hero.get(\"buttonText\") and hero.get(\"buttonLink\"):\n        button = f'<a class=\"button\" href=\"{esc(link_for(hero[\"buttonLink\"]))}\">{esc(hero[\"buttonText\"])}<\/a>'\n    return fill(read_part(root, \"src/components/Hero.html\"), {\n        \"image\": image,\n        \"title\": esc(hero[\"title\"]),\n        \"subtitle\": esc(hero.get(\"subtitle\")),\n        \"button\": button,\n    })\n\n\ndef footer_html(root, site, contact):\n    lines = []\n    if contact.get(\"email\"):\n        lines.append(f'<p><a href=\"{esc(\"mailto:\" + contact[\"email\"])}\">{esc(contact[\"email\"])}<\/a><\/p>')\n    social_names = ((\"github\", \"GitHub\"), (\"instagram\", \"Instagram\"), (\"youtube\", \"YouTube\"))\n    links = [f'<li><a href=\"{esc(contact[\"social\"][key])}\">{name}<\/a><\/li>'\n             for key, name in social_names if (contact.get(\"social\") or {}).get(key)]\n    if links:\n        lines.append(f'<ul class=\"links\">{\"\".join(links)}<\/ul>')\n    lines.append('<p><a href=\"privacy.html\">개인정보 처리방침<\/a><\/p>')\n    return fill(read_part(root, \"src/components/Footer.html\"), {\n        \"name\": esc(site[\"name\"]),\n        \"contact\": \"\".join(lines),\n    })\n\n\ndef items_html(items, layout):\n    \"\"\"사업 목록. 카드형 배치에서는 격자로 감쌉니다.\"\"\"\n    body = project_articles(items)\n    if layout == \"card\" and body:\n        return f'<div class=\"cards\">{body}<\/div>'\n    return body\n\n\ndef block(title, body_html):\n    return f'<section class=\"block\"><h2>{esc(title)}<\/h2>{body_html}<\/section>'\n\n\ndef project_articles(items):\n    ordered = sorted(items, key=lambda i: i.get(\"date\") or \"\", reverse=True)\n    out = []\n    for item in ordered:\n        title = esc(item[\"title\"])\n        if item.get(\"url\"):\n            title = f'<a href=\"{esc(item[\"url\"])}\">{title}<\/a>'\n        date = f'<time datetime=\"{esc(item[\"date\"])}\">{esc(item[\"date\"])}<\/time>' if item.get(\"date\") else \"\"\n        summary = f'<p>{esc(item[\"summary\"])}<\/p>' if item.get(\"summary\") else \"\"\n        out.append(f\"<article><h3>{title}<\/h3>{date}{summary}<\/article>\")\n    return \"\".join(out)\n\n\ndef build_pages(root, data):\n    \"\"\"페이지 이름과 전체 HTML 을 돌려줍니다.\"\"\"\n    site, nav, theme = data[\"site\"], data[\"nav\"], data[\"theme\"]\n    style = theme_css(theme) + \"\\n\" + read_part(root, \"src/styles/site.css\")\n    pages = {}\n\n    def page(file_name, title, main_html, description):\n        full_title = site[\"name\"] if file_name == \"index.html\" else f\"{title} | {site['name']}\"\n        pages[file_name] = fill(read_part(root, \"src/pages/page.html\"), {\n            \"lang\": esc(site.get(\"language\", \"ko\")),\n            \"title\": esc(full_title),\n            \"description\": esc(site.get(\"description\")),\n            \"style\": style,\n            \"header\": header_html(root, site, nav, file_name),\n            \"main\": main_html,\n            \"footer\": footer_html(root, site, data[\"contact\"]),\n            \"layout\": esc(theme[\"layout\"]),\n        })\n\n    home = data[\"home\"]\n    preview = items_html(data[\"projects\"].get(\"items\", [])[:3], theme[\"layout\"])\n    home_main = (\n        hero_html(root, home)\n        + block(\"소개\", f'<p class=\"pre\">{esc(home.get(\"intro\"))}<\/p>')\n        + (block(data[\"projects\"][\"title\"], preview) if preview else \"\")\n    )\n    page(\"index.html\", site[\"name\"], home_main, site.get(\"description\", \"\"))\n\n    page(\"about.html\", data[\"about\"][\"title\"],\n         block(data[\"about\"][\"title\"], f'<p class=\"pre\">{esc(data[\"about\"][\"body\"])}<\/p>'),\n         data[\"about\"][\"body\"])\n    page(\"projects.html\", data[\"projects\"][\"title\"],\n         block(data[\"projects\"][\"title\"], items_html(data[\"projects\"].get(\"items\", []), theme[\"layout\"])),\n         data[\"projects\"][\"title\"])\n    contact = data[\"contact\"]\n    support = data[\"support\"]\n    ways = project_articles(support.get(\"ways\", []))\n    support_main = block(support[\"title\"], f'<p class=\"pre\">{esc(support[\"body\"])}<\/p>')\n    if ways:\n        support_main += block(\"후원 방법\", ways)\n    if support.get(\"notice\"):\n        support_main += block(\"안내\", f'<p class=\"pre\">{esc(support[\"notice\"])}<\/p>')\n    page(\"support.html\", support[\"title\"], support_main, support[\"body\"])\n    news = data[\"news\"]\n    page(\"news.html\", news[\"title\"],\n         block(news[\"title\"], project_articles(news.get(\"items\", []))), news[\"title\"])\n    transparency = data[\"transparency\"]\n    page(\"transparency.html\", transparency[\"title\"],\n         block(transparency[\"title\"], f'<p class=\"pre\">{esc(transparency[\"body\"])}<\/p>')\n         + block(\"사업 · 재무 자료\", project_articles(transparency.get(\"reports\", [])))\n         + block(\"사업비 구성\", f'<p class=\"pre\">{esc(transparency[\"costs\"])}<\/p>')\n         + block(\"외부 확인\", f'<p class=\"pre\">{esc(transparency[\"disclosure\"])}<\/p>'),\n         transparency[\"body\"])\n    volunteer = data[\"volunteer\"]\n    page(\"volunteer.html\", volunteer[\"title\"],\n         block(volunteer[\"title\"], f'<p class=\"pre\">{esc(volunteer[\"body\"])}<\/p>')\n         + block(\"활동 종류\", project_articles(volunteer.get(\"positions\", [])))\n         + block(\"신청 방법\", f'<p class=\"pre\">{esc(volunteer[\"apply\"])}<\/p>'),\n         volunteer[\"body\"])\n    privacy = data[\"privacy\"]\n    page(\"privacy.html\", privacy[\"title\"],\n         block(privacy[\"title\"], f'<p class=\"pre\">{esc(privacy[\"body\"])}<\/p>')\n         + block(\"처리 항목\", project_articles(privacy.get(\"items\", []))),\n         privacy[\"body\"])\n    page(\"contact.html\", contact[\"title\"],\n         block(contact[\"title\"], f'<p class=\"pre\">{esc(contact[\"body\"])}<\/p>'),\n         contact[\"body\"])\n    return pages\n\n\ndef write_site(root, out_dir, pages):\n    out = Path(out_dir)\n    if out.exists():\n        shutil.rmtree(out)\n    out.mkdir(parents=True)\n    for name, content in pages.items():\n        (out / name).write_text(content, encoding=\"utf-8\")\n    public = Path(root) / \"public\"\n    if public.exists():\n        shutil.copytree(public, out / \"public\", ignore=shutil.ignore_patterns(\".gitkeep\"))\n    return sorted(pages)\n\n\ndef main(argv=None):\n    parser = argparse.ArgumentParser(description=\"설정으로 홈페이지 파일 만들기\")\n    parser.add_argument(\"--root\", default=str(ROOT), help=\"템플릿 폴더 (기본: 이 스크립트의 상위 폴더)\")\n    parser.add_argument(\"--out\", default=None, help=\"만들 폴더 (기본: <템플릿 폴더>/dist)\")\n    args = parser.parse_args(argv)\n\n    root = Path(args.root)\n    data, errors = validate(root)\n    if errors:\n        print(\"설정을 고쳐 주세요. 아직 아무 파일도 만들지 않았습니다:\")\n        for e in errors:\n            print(f\"- {e}\")\n        return 1\n    out = args.out or (root / \"dist\")\n    names = write_site(root, out, build_pages(root, data))\n    print(f\"홈페이지 파일을 만들었습니다 ({out}): {', '.join(names)}\")\n    return 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n",
  "scripts/site_tool.py": "#!/usr/bin/env python3\n\"\"\"AI 와 계정 없이 홈페이지를 만들고 고치는 기본 도구입니다.\n\n사용법 (--root 로 홈페이지 폴더를 고를 수 있습니다. 기본값은 이 파일이 있는 폴더):\n    python scripts/site_tool.py designs                          # 디자인 목록\n    python scripts/site_tool.py new ../내기관 --name \"민수의 작업실\" --design warm-orange\n    python scripts/site_tool.py set site.name \"새 이름\"            # 설정 바꾸기 (검사 후 저장)\n    python scripts/site_tool.py set home.hero.title \"더 나은 내일\"\n    python scripts/site_tool.py set projects.items.0.title \"새 사업\"\n    python scripts/site_tool.py check                            # 검사\n    python scripts/site_tool.py build                            # dist/ 에 페이지 만들기\n\n'set' 의 첫 단어는 파일을 가리킵니다: site, theme, nav, home, about, projects, support, transparency, volunteer, privacy, news, contact\n\"\"\"\n\nimport argparse\nimport json\nimport shutil\nimport sys\nfrom pathlib import Path\n\nHERE = Path(__file__).resolve().parent\nsys.path.insert(0, str(HERE))\nimport generate  # noqa: E402\nfrom validate import validate  # noqa: E402\n\nROOT = HERE.parent\nFILE_FOR = {\n    \"site\": \"config/site.json\", \"nav\": \"config/navigation.json\", \"theme\": \"config/theme.json\",\n    \"home\": \"content/home.json\", \"about\": \"content/about.json\",\n    \"projects\": \"content/projects.json\", \"support\": \"content/support.json\",\n    \"transparency\": \"content/transparency.json\", \"volunteer\": \"content/volunteer.json\",\n    \"privacy\": \"content/privacy.json\", \"news\": \"content/news.json\", \"contact\": \"content/contact.json\",\n}\nTHEME_KEYS = (\"primaryColor\", \"backgroundColor\", \"textColor\", \"font\", \"radius\", \"spacing\", \"layout\")\nIGNORE = shutil.ignore_patterns(\"dist\", \"__pycache__\", \".git\")\n\n\ndef load_designs(root):\n    return json.loads((Path(root) / \"config\" / \"designs.json\").read_text(encoding=\"utf-8\"))\n\n\ndef cmd_designs(args):\n    for key, design in load_designs(args.root).items():\n        print(f\"{key:14} {design['label']}  (강조색 {design['primaryColor']}, 글꼴 {design['font']}, 여백 {design['spacing']})\")\n    return 0\n\n\ndef _finish(root, what):\n    _, errors = validate(root)\n    if errors:\n        print(\"설정을 고쳐 주세요:\")\n        for e in errors:\n            print(f\"- {e}\")\n        return 1\n    print(f\"검사 통과: {what}\")\n    return 0\n\n\ndef cmd_new(args):\n    target = Path(args.folder).resolve()\n    if target.exists():\n        print(f\"이미 있는 폴더에는 만들지 않습니다: {target}\")\n        return 1\n    shutil.copytree(args.root, target, ignore=IGNORE)\n    site_path = target / FILE_FOR[\"site\"]\n    site = json.loads(site_path.read_text(encoding=\"utf-8\"))\n    if args.name:\n        site[\"name\"] = \" \".join(args.name)\n    site_path.write_text(json.dumps(site, ensure_ascii=False, indent=2) + \"\\n\", encoding=\"utf-8\")\n    if args.design:\n        designs = load_designs(target)\n        if args.design not in designs:\n            shutil.rmtree(target)\n            print(f\"디자인은 {', '.join(designs)} 중 하나여야 합니다.\")\n            return 1\n        preset = {k: designs[args.design][k] for k in THEME_KEYS}\n        (target / FILE_FOR[\"theme\"]).write_text(json.dumps(preset, ensure_ascii=False, indent=2) + \"\\n\", encoding=\"utf-8\")\n    return _finish(target, f\"새 홈페이지 폴더를 만들었습니다: {target}\\n다음: cd 해당폴더 && python scripts/site_tool.py build\")\n\n\ndef _walk(data, keys):\n    \"\"\"경로를 따라 값을 찾습니다. 목록은 번호(0부터)로 고릅니다.\"\"\"\n    node = data\n    for key in keys[:-1]:\n        node = node[int(key)] if isinstance(node, list) else node[key]\n    last = keys[-1]\n    return node, (int(last) if isinstance(node, list) else last)\n\n\ndef cmd_set(args):\n    root = Path(args.root)\n    parts = args.path.split(\".\")\n    if len(parts) < 2 or parts[0] not in FILE_FOR:\n        print(f\"경로는 파일이름.항목 형식이어야 합니다. 파일: {', '.join(FILE_FOR)}\")\n        return 1\n    path = root / FILE_FOR[parts[0]]\n    original = path.read_text(encoding=\"utf-8\")\n    text = \" \".join(args.value)\n    try:\n        value = json.loads(text)\n    except json.JSONDecodeError:\n        value = text\n    data = json.loads(original)\n    try:\n        node, last = _walk(data, parts[1:])\n        node[last] = value\n    except (KeyError, IndexError, ValueError, TypeError):\n        print(f\"바꿀 항목을 찾지 못했습니다: {args.path}\")\n        return 1\n    path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + \"\\n\", encoding=\"utf-8\")\n    _, errors = validate(root)\n    if errors:\n        path.write_text(original, encoding=\"utf-8\")  # 틀린 값은 저장하지 않고 되돌립니다\n        print(\"저장하지 않았습니다. 다음을 고쳐 주세요:\")\n        for e in errors:\n            print(f\"- {e}\")\n        return 1\n    print(f\"{args.path} 을(를) 바꾸고 저장했습니다: {value!r}\")\n    return 0\n\n\ndef cmd_check(args):\n    return _finish(args.root, \"설정과 콘텐츠가 맞습니다.\")\n\n\ndef cmd_build(args):\n    return generate.main([\"--root\", str(args.root)] + ([\"--out\", args.out] if args.out else []))\n\n\ndef build_parser():\n    parser = argparse.ArgumentParser(prog=\"site_tool\", description=\"AI 없이 홈페이지 만들기\")\n    parser.add_argument(\"--root\", default=str(ROOT), help=\"홈페이지 폴더 (기본: 이 파일이 있는 폴더)\")\n    sub = parser.add_subparsers(dest=\"command\", required=True)\n    sub.add_parser(\"designs\", help=\"디자인 목록 보기\").set_defaults(func=cmd_designs)\n    p = sub.add_parser(\"new\", help=\"새 홈페이지 폴더 만들기\")\n    p.add_argument(\"folder\")\n    p.add_argument(\"--name\", nargs=\"+\", help=\"기관 이름 (따옴표 없이 여러 단어 가능)\")\n    p.add_argument(\"--design\", help=\"디자인 이름 (designs 명령으로 확인)\")\n    p.set_defaults(func=cmd_new)\n    p = sub.add_parser(\"set\", help=\"설정이나 콘텐츠 값 바꾸기 (검사 후 저장)\")\n    p.add_argument(\"path\", help=\"예: site.name, theme.primaryColor, home.hero.title, projects.items.0.title\")\n    p.add_argument(\"value\", nargs=\"+\", help=\"새 값. 따옴표 없이 여러 단어를 써도 됩니다\")\n    p.set_defaults(func=cmd_set)\n    sub.add_parser(\"check\", help=\"설정 검사\").set_defaults(func=cmd_check)\n    p = sub.add_parser(\"build\", help=\"dist/ 에 페이지 만들기\")\n    p.add_argument(\"--out\", default=None)\n    p.set_defaults(func=cmd_build)\n    return parser\n\n\ndef main(argv=None):\n    args = build_parser().parse_args(argv)\n    return args.func(args)\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\n",
  "schema.json": "{\n  \"files\": {\n    \"site\": \"config/site.json\",\n    \"nav\": \"config/navigation.json\",\n    \"theme\": \"config/theme.json\",\n    \"home\": \"content/home.json\",\n    \"about\": \"content/about.json\",\n    \"projects\": \"content/projects.json\",\n    \"support\": \"content/support.json\",\n    \"transparency\": \"content/transparency.json\",\n    \"volunteer\": \"content/volunteer.json\",\n    \"privacy\": \"content/privacy.json\",\n    \"news\": \"content/news.json\",\n    \"contact\": \"content/contact.json\"\n  },\n  \"pages\": {\n    \"/\": \"index.html\",\n    \"/about\": \"about.html\",\n    \"/projects\": \"projects.html\",\n    \"/support\": \"support.html\",\n    \"/transparency\": \"transparency.html\",\n    \"/news\": \"news.html\",\n    \"/volunteer\": \"volunteer.html\",\n    \"/contact\": \"contact.html\",\n    \"/privacy\": \"privacy.html\"\n  },\n  \"languages\": [\"ko\", \"en\", \"ja\"],\n  \"fonts\": {\n    \"system-ui\": \"system-ui, sans-serif\",\n    \"serif\": \"Georgia, serif\",\n    \"mono\": \"ui-monospace, monospace\"\n  },\n  \"spacings\": {\"compact\": 12, \"normal\": 24, \"airy\": 40},\n  \"layouts\": [\"classic\", \"modern\", \"card\", \"minimal\"],\n  \"theme_keys\": [\"primaryColor\", \"backgroundColor\", \"textColor\", \"font\", \"radius\", \"spacing\", \"layout\"],\n  \"image_extensions\": [\"jpg\", \"jpeg\", \"png\", \"webp\", \"gif\"],\n  \"help\": [\n    \"site.name / site.description / site.language (ko, en, ja)\",\n    \"theme.primaryColor / theme.backgroundColor / theme.textColor (#RRGGBB), theme.font (system-ui, serif, mono), theme.radius (0~32), theme.spacing (compact, normal, airy), theme.layout (classic, modern, card, minimal)\",\n    \"home.hero.title / home.hero.subtitle / home.hero.buttonText / home.hero.buttonLink, home.intro\",\n    \"about.title / about.body\",\n    \"projects.title, projects.items.번호.title / .date / .summary / .url\",\n    \"support.title / support.body / support.notice, support.ways.번호.title / .summary\",\n    \"transparency.title / transparency.body / transparency.costs / transparency.disclosure, transparency.reports.번호.title / .summary\",\n    \"volunteer.title / volunteer.body / volunteer.apply, volunteer.positions.번호.title / .summary\",\n    \"privacy.title / privacy.body, privacy.items.번호.title / .summary\",\n    \"news.title, news.items.번호.title / .date / .summary / .url\",\n    \"contact.title / contact.body / contact.email, contact.social.github / .instagram / .youtube\",\n    \"nav.번호.label / nav.번호.path (/, /about, /projects, /support, /transparency, /news, /volunteer, /contact)\"\n  ]\n}\n",

  ".github/workflows/deploy.yml": "# 이 파일은 새 홈페이지 저장소의 루트 .github/workflows/ 에 복사해서 씁니다.\n# 설정을 검사하고 페이지를 만든 뒤 GitHub Pages 에 올립니다. 계정 외의 설치는 필요 없습니다.\nname: Deploy site\n\non:\n  push:\n    branches: [main]\n  workflow_dispatch:\n\npermissions:\n  contents: read\n  pages: write\n  id-token: write\n\nconcurrency:\n  group: pages\n  cancel-in-progress: true\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: \"3.12\"\n      - name: 설정 검사\n        run: python scripts/validate.py\n      - name: 페이지 만들기\n        run: python scripts/generate.py --out dist\n      - uses: actions/upload-pages-artifact@v3\n        with:\n          path: dist\n\n  deploy:\n    needs: build\n    runs-on: ubuntu-latest\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    steps:\n      - id: deployment\n        uses: actions/deploy-pages@v4\n",
  "README.md": "# 홈페이지 템플릿 (비영리 단체 기본)\n\nNGO, 사회복지법인, 비영리 법인의 기관 소개와 후원 모금 홈페이지를 기본으로 합니다. 기관 이름, 금액, 계좌, 영수증 발급 방법처럼 사실이 필요한 내용은 직접 확인해서 적어 주세요. 템플릿은 빈칸 안내문만 담고 있습니다.\n\n설정 파일과 콘텐츠 파일을 고치면 홈페이지 파일이 만들어집니다. Node.js 도 AI 도 필요 없고, Python 3 만 있으면 됩니다.\n\n## 처음 시작하기 (5분)\n\n둘 중 하나를 고르면 됩니다.\n\n**A. 브라우저에서 (터미널 없이)**\n\n> 편집기 열기: [편집기 파일 보기](https://github.com/sunnykim717/claude-project/blob/claude/funny-franklin-mknfpi/website-template/editor/index.html) — 이 페이지에서 **Raw** 를 누르거나 파일을 내려받아 `index.html` 로 저장한 뒤 브라우저로 여세요. 저장소를 합치면 주소의 `claude/funny-franklin-mknfpi` 부분이 `main` 으로 바뀝니다.\n\n1. `editor/index.html` 을 브라우저(크롬, 엣지 등)로 엽니다.\n2. 위쪽 명령 칸에 적고 Enter 를 누릅니다. 예: `set site.name 희망 나눔 복지재단`\n3. 오른쪽 미리보기에서 확인하고, **프로젝트 내려받기 (zip)** 을 누릅니다.\n4. 받은 zip 을 풀고 아래 **배포하기** 를 따릅니다.\n\n**B. 터미널에서 (Python 3 만 있으면 됩니다)**\n\n```bash\npython scripts/site_tool.py new ../내홈페이지 --name 희망 나눔 복지재단 --design warm-orange\ncd ../내홈페이지\npython scripts/site_tool.py set home.hero.title 함께 걸어가는 이웃\npython scripts/site_tool.py check\npython scripts/site_tool.py build --out dist\n```\n\n- `designs` 명령으로 디자인 목록을 볼 수 있습니다.\n- `set` 뒤의 값은 따옴표 없이 여러 단어를 써도 됩니다.\n- `check` 는 틀린 곳을 알려 줍니다. 메시지에 나온 파일을 고치고 다시 실행하세요.\n\n**배포하기 (GitHub Pages)**\n\n1. 이 폴더를 새 GitHub 저장소의 최상위에 올립니다.\n2. 저장소 **Settings → Pages** 에서 Source 를 **GitHub Actions** 로 고릅니다.\n3. `.github/workflows/deploy.yml` 이 `main` 에 올라가면 자동으로 배포됩니다.\n\n> 배포 전에 `content/` 의 빈칸 안내문을 실제 내용으로 바꾸세요. 기관 정보, 금액, 계좌, 영수증 안내는 직접 확인해서 적어야 합니다.\n\n## 폴더 구성\n\n| 폴더 | 무엇을 넣나요? |\n| --- | --- |\n| `config/site.json` | 기관 이름, 소개 한 줄, 언어 |\n| `config/navigation.json` | 메뉴 이름과 주소. 주소는 `/`, `/about`, `/projects`, `/contact` 중 하나 |\n| `config/theme.json` | 색(`primaryColor`, `backgroundColor`, `textColor`), 글꼴(`system-ui`, `serif`, `mono`), 모서리(0~32), 여백(`compact`, `normal`, `airy`) |\n| `content/home.json` | 첫 화면의 제목, 소개 문구, 버튼 |\n| `content/about.json` | 기관소개 글 |\n| `content/projects.json` | 주요 사업 목록 (제목, 날짜, 설명, 링크) |\n| `content/support.json` | 후원 안내 글, 후원 방법 목록, 영수증·사용 내역 안내 |\n| `content/news.json` | 소식 목록 (제목, 날짜, 설명, 링크) |\n| `content/transparency.json` | 투명성·재무 공개: 사업·재무 자료, 사업비 구성, 외부 확인 경로 |\n| `content/volunteer.json` | 자원봉사 안내: 활동 종류, 신청 방법 |\n| `content/privacy.json` | 개인정보 처리방침 (바닥글에 자동으로 링크됩니다) |\n| `content/contact.json` | 문의 글, 이메일, SNS 링크 |\n| `public/images/` | 그림 파일 (아직 페이지에 넣는 설정은 없습니다) |\n| `src/components/` | 머리글, 첫 화면, 바닥글의 모양 (`{{이름}}` 자리에 값이 들어갑니다) |\n| `src/pages/page.html` | 모든 페이지의 뼈대 |\n| `src/styles/site.css` | 페이지 모양 |\n| `scripts/validate.py` | 설정과 콘텐츠가 맞는지 검사 |\n| `scripts/generate.py` | 검사 후 `dist/` 에 페이지 만들기 |\n| `.github/workflows/deploy.yml` | GitHub Pages 에 배포 (새 저장소의 루트로 복사해서 씁니다) |\n\n## 설치 없이 쓰기 (편집기)\n\n`editor/index.html` 파일을 브라우저로 열면 됩니다. 터미널이 필요 없습니다.\n\n- 위쪽 **명령 입력** 칸에 명령을 적고 Enter 를 누릅니다. 아래 버튼을 누르면 명령이 채워집니다.\n- 명령 예: `set site.name 민수의 작업실`, `design warm-orange`, `add-project 이름 | 2026-11-03 | 요약 | https://...`, `check`\n- 오른쪽 미리보기가 바로 바뀝니다. 페이지별 파일은 **받기** 버튼으로 내려받습니다.\n- **설정 저장 (파일)** 로 전체 내용을 파일로 보관하고, **설정 불러오기** 로 다시 엽니다.\n\n편집기 파일은 `scripts/bundle_editor.py` 로 만듭니다. 엔진(`editor/engine.js`)은 Python 생성기와 같은 결과를 내는지 테스트로 확인합니다.\n\n## 사용법 (터미널)\n\n```bash\npython scripts/validate.py     # 설정 검사\npython scripts/generate.py     # dist/ 에 페이지 만들기\n```\n\n`dist/index.html` 을 브라우저로 열어 확인하세요. 고친 뒤에는 두 명령을 다시 실행합니다.\n\n## 주의\n\n- 링크는 `https://` 주소 또는 이 템플릿의 페이지 주소(`/about` 등)만 쓸 수 있습니다.\n- 날짜는 `2026-01-15` 형식으로 적습니다.\n- 그림은 `public/images/` 에 넣고, 설정에서는 `/images/파일이름` 으로 적습니다.\n- 배포하면 `dist/` 의 파일이 공개됩니다. 개인정보는 넣지 마세요.\n",
  ".gitignore": "dist/\n__pycache__/\n",
  "public/images/.gitkeep": ""
};
(function () {
  "use strict";
  SiteEngine.useSchema(SCHEMA);
  var STORAGE_KEY = "website-editor:v1";
  var KEY_FILES = SCHEMA.files;
  var THEME_KEYS = SCHEMA.theme_keys;
  var PATH_HELP = SCHEMA.help;
  var EXAMPLES = [
    "set site.name 민수의 작업실",
    "set support.notice 기부금 영수증 발급 방법을 적어 주세요.",
    "set home.hero.title 더 나은 내일을 만듭니다",
    "set about.body 기관의 목적과 활동을 적어 주세요.",
    "set contact.email hello@example.com",
    "design warm-orange",
    "add-project 빌더 공개 | 2026-11-03 | 주민 여러분을 초대합니다 | https://example.com",
    "remove-project 1",
    "check"
  ];

  var files = loadFiles();
  var currentPage = "index.html";

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function loadFiles() {
    try {
      var saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved && typeof saved === "object") return Object.assign(clone(DEFAULT_FILES), saved);
    } catch (e) { /* 저장된 값을 쓸 수 없으면 처음 상태를 씁니다 */ }
    return clone(DEFAULT_FILES);
  }

  // 저장이 안 되면 false 를 돌려줍니다 (사진이 많으면 브라우저 저장 공간이 찹니다).
  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(files));
      return true;
    } catch (e) {
      return false;
    }
  }

  function say(text, ok) {
    var log = document.getElementById("log");
    log.textContent = text;
    log.className = "log " + (ok === undefined ? "" : ok ? "ok" : "err");
  }

  // 'site.name' 같은 경로를 파일과 항목으로 나눕니다.
  function locate(path) {
    var parts = String(path).split(".");
    var key = parts[0];
    if (!KEY_FILES[key] || parts.length < 2) return null;
    return { file: KEY_FILES[key], keys: parts.slice(1) };
  }

  function parseValue(text) {
    var t = text.trim();
    if (/^(\{|\[|"|-?\d|true$|false$|null$)/.test(t)) {
      try { return JSON.parse(t); } catch (e) { /* 글자로 취급합니다 */ }
    }
    return t;
  }

  function setValue(target, path, value) {
    var parts = path.slice();
    var node = target;
    for (var i = 0; i < parts.length - 1; i++) {
      var step = Array.isArray(node) ? Number(parts[i]) : parts[i];
      if (node[step] === undefined) throw new Error("항목을 찾지 못했습니다: " + parts.slice(0, i + 1).join("."));
      node = node[step];
    }
    var last = parts[parts.length - 1];
    if (Array.isArray(node)) {
      var index = Number(last);
      if (!Number.isInteger(index) || index < 0 || index >= node.length) throw new Error("번호가 맞지 않습니다: " + last);
      node[index] = value;
    } else {
      if (node === null || typeof node !== "object") throw new Error("이 항목에는 값을 넣을 수 없습니다.");
      node[last] = value;
    }
  }

  function validateCurrent() {
    return SiteEngine.validate(files).errors;
  }

  // 바꾼 뒤 검사합니다. 틀리면 바꾸기 전 상태로 되돌립니다.
  function commit(mutator, successText) {
    var before = clone(files);
    try {
      mutator(files);
    } catch (e) {
      files = before;
      return say(e.message, false);
    }
    var errors = validateCurrent();
    if (errors.length) {
      files = before;
      return say("저장하지 않았습니다. 다음을 고쳐 주세요:\n- " + errors.join("\n- "), false);
    }
    var saved = persist();
    render();
    if (!saved) return say("저장 공간이 부족해 브라우저에 저장하지 못했습니다. 설정 저장(파일)으로 보관해 주세요.", false);
    if (successText) say(successText, true);
  }

  function setCommand(path, rawValue) {
    var loc = locate(path);
    if (!loc) return say("경로는 site, theme, nav, home, about, projects, contact 로 시작해야 합니다.", false);
    commit(function (f) {
      var data = JSON.parse(f[loc.file]);
      setValue(data, loc.keys, parseValue(rawValue));
      f[loc.file] = JSON.stringify(data, null, 2) + "\n";
    }, path + " 을(를) 바꾸고 저장했습니다.");
  }

  function applyDesign(name) {
    if (!DESIGNS[name]) return say("디자인은 " + Object.keys(DESIGNS).join(", ") + " 중 하나여야 합니다.", false);
    commit(function (f) {
      var theme = JSON.parse(f[KEY_FILES.theme]);
      THEME_KEYS.forEach(function (k) { theme[k] = DESIGNS[name][k]; });
      f[KEY_FILES.theme] = JSON.stringify(theme, null, 2) + "\n";
    }, "디자인 '" + DESIGNS[name].label + "' 을 적용했습니다.");
  }

  function addProject(text) {
    var parts = text.split("|").map(function (p) { return p.trim(); }).filter(Boolean);
    var item = { title: "", date: "", summary: "", url: "" };
    var extra = [];
    parts.forEach(function (part) {
      if (/^https?:\/\//.test(part)) item.url = part;
      else if (/^\d{4}-\d{2}-\d{2}$/.test(part)) item.date = part;
      else if (!item.title) item.title = part;
      else extra.push(part);
    });
    item.summary = extra.join(" ");
    if (!item.title) return say("사업 이름을 적어 주세요. 예: add-project 빌더 공개 | 2026-11-03 | 요약 | https://...", false);
    commit(function (f) {
      var data = JSON.parse(f[KEY_FILES.projects]);
      data.items.push(item);
      f[KEY_FILES.projects] = JSON.stringify(data, null, 2) + "\n";
    }, "사업 '" + item.title + "' 을 추가했습니다.");
  }

  function removeProject(text) {
    var index = Number(text.trim()) - 1;
    commit(function (f) {
      var data = JSON.parse(f[KEY_FILES.projects]);
      if (!Number.isInteger(index) || index < 0 || index >= data.items.length) throw new Error("번호가 맞지 않습니다. 1부터 " + data.items.length + " 사이여야 합니다.");
      var removed = data.items.splice(index, 1)[0];
      f[KEY_FILES.projects] = JSON.stringify(data, null, 2) + "\n";
      say("사업 '" + removed.title + "' 을 지웠습니다.", true);
    }, "");
  }

  function runCommand(line) {
    var text = line.trim();
    if (!text) return say("명령을 적어 주세요. 도움말을 누르면 명령 목록을 볼 수 있습니다.", false);
    var space = text.indexOf(" ");
    var word = space === -1 ? text : text.slice(0, space);
    var rest = space === -1 ? "" : text.slice(space + 1).trim();
    if (word === "set") {
      var sp = rest.indexOf(" ");
      if (sp === -1) return say("사용법: set 경로 값   예: set site.name 민수의 작업실", false);
      return setCommand(rest.slice(0, sp), rest.slice(sp + 1));
    }
    if (word === "design") return applyDesign(rest);
    if (word === "designs") return say(Object.keys(DESIGNS).map(function (k) { return k + " : " + DESIGNS[k].label; }).join("\n"), true);
    if (word === "add-project") return addProject(rest);
    if (word === "remove-project") return removeProject(rest);
    if (word === "check") {
      var errors = validateCurrent();
      return errors.length ? say("다음을 고쳐 주세요:\n- " + errors.join("\n- "), false) : say("검사 통과: 설정과 콘텐츠가 맞습니다.", true);
    }
    if (word === "help" || word === "도움말") return say("명령 목록:\n" + [
      "set 경로 값  - 값 바꾸기 (검사 후 저장)",
      "design 이름  - 디자인 적용 (" + Object.keys(DESIGNS).join(", ") + ")",
      "designs      - 디자인 목록",
      "add-project 이름 | 날짜 | 요약 | 링크  - 사업 추가",
      "remove-project 번호  - 사업 삭제",
      "check        - 검사",
      "",
      "바꿀 수 있는 경로:",
      PATH_HELP.join("\n")
    ].join("\n"), true);
    return say("알 수 없는 명령입니다: " + word + "\n도움말을 누르면 명령 목록을 볼 수 있습니다.", false);
  }

  function render() {
    var result = SiteEngine.build(files);
    var frame = document.getElementById("frame");
    if (result.ok) {
      var html = result.pages[currentPage] || result.pages["index.html"];
      Object.keys(files).forEach(function (name) {
        if (name.indexOf("public/images/") === 0) html = html.split('src="' + name + '"').join('src="' + files[name] + '"');
      });
      frame.srcdoc = html;
    } else {
      frame.srcdoc = "<p style='font-family:system-ui;padding:16px;color:#b91c1c'>설정에 오류가 있어 미리보기를 만들 수 없습니다. 아래 '검사' 명령으로 확인해 주세요.</p>";
    }
    var downloads = document.getElementById("downloads");
    downloads.replaceChildren();
    if (result.ok) {
      Object.keys(result.pages).sort().forEach(function (name) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "secondary";
        btn.textContent = name + " 받기";
        btn.addEventListener("click", function () { download(name, result.pages[name], "text/html;charset=utf-8"); });
        downloads.append(btn);
      });
    }
  }

  // 사진을 1200px 이하로 줄여 JPEG 데이터로 바꿉니다 (브라우저 안에서만 처리).
  function shrinkPhoto(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, 1200 / img.width);
        var canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("사진을 읽을 수 없습니다.")); };
      img.src = url;
    });
  }

  function bytesOf(dataUrl) {
    var binary = atob(dataUrl.split(",")[1]);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  function setHeroPhoto(file) {
    if (file.size > 10 * 1024 * 1024) return say("사진이 너무 큽니다. 10MB 이하의 사진을 골라 주세요.", false);
    shrinkPhoto(file).then(function (dataUrl) {
      var name = "photo-" + Date.now() + ".jpg";
      var before = clone(files);
      var old = (JSON.parse(files[KEY_FILES.home]).hero || {}).image;
      try {
        files["public/images/" + name] = dataUrl;
        var home = JSON.parse(files[KEY_FILES.home]);
        home.hero = home.hero || {};
        home.hero.image = "/images/" + name;
        files[KEY_FILES.home] = JSON.stringify(home, null, 2) + "\n";
        var errors = validateCurrent();
        if (errors.length) throw new Error(errors.join("\n"));
        if (old && files["public/" + old.replace(/^\/+/, "")]) delete files["public/" + old.replace(/^\/+/, "")];
        var saved = persist();
        render();
        say(saved ? "첫 화면 사진을 바꿨습니다." : "사진은 바꿨지만 브라우저 저장 공간이 부족합니다. 설정 저장(파일)을 받아 두세요.", saved);
      } catch (e) {
        files = before;
        say("사진을 넣지 않았습니다. " + e.message, false);
      }
    }, function (e) { say(e.message, false); });
  }

  // 저장소 루트에 그대로 풀 수 있는 폴더 구조로 zip 을 만듭니다.
  function projectEntries() {
    var result = SiteEngine.build(files);
    if (!result.ok) return null;
    var entries = {};
    Object.keys(PROJECT_EXTRA).forEach(function (name) { entries[name] = PROJECT_EXTRA[name]; });
    Object.keys(files).forEach(function (name) { entries[name] = files[name]; });
    Object.keys(result.pages).forEach(function (name) { entries["dist/" + name] = result.pages[name]; });
    Object.keys(files).forEach(function (name) {
      if (name.indexOf("public/images/") === 0) entries["dist/" + name] = files[name];
    });
    return entries;
  }

  function downloadProject() {
    var entries = projectEntries();
    if (!entries) return say("설정에 오류가 있어 내려받을 수 없습니다. 검사 명령으로 확인해 주세요.", false);
    var list = Object.keys(entries).sort().map(function (name) {
      var value = entries[name];
      if (/^data:image\//.test(value)) return { name: name, bytes: bytesOf(value) };
      return { name: name, text: value };
    });
    var bytes = SiteZip.buildZip(list);
    var blob = new Blob([bytes], { type: "application/zip" });
    var link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "홈페이지-프로젝트.zip";
    link.click();
    URL.revokeObjectURL(link.href);
    say("zip 을 받았습니다. 압축을 풀어 저장소 맨 위 폴더에 그대로 넣고 올리면 배포 워크플로가 실행됩니다.", true);
  }

  function download(name, text, type) {
    var blob = new Blob([text], { type: type });
    var link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = name;
    link.click();
    URL.revokeObjectURL(link.href);
  }

  function init() {
    var examples = document.getElementById("examples");
    EXAMPLES.forEach(function (cmd) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "secondary";
      btn.textContent = cmd;
      btn.addEventListener("click", function () { document.getElementById("command").value = cmd; });
      examples.append(btn);
    });

    var select = document.getElementById("design-select");
    Object.keys(DESIGNS).forEach(function (k) {
      var opt = document.createElement("option");
      opt.value = k;
      opt.textContent = DESIGNS[k].label;
      select.append(opt);
    });
    document.getElementById("btn-design").addEventListener("click", function () { applyDesign(select.value); });

    var pageSelect = document.getElementById("page-select");
    ["index.html", "about.html", "projects.html", "contact.html"].forEach(function (name) {
      var opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      pageSelect.append(opt);
    });
    pageSelect.addEventListener("change", function () { currentPage = pageSelect.value; render(); });

    var command = document.getElementById("command");
    document.getElementById("btn-run").addEventListener("click", function () { runCommand(command.value); render(); });
    command.addEventListener("keydown", function (event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        runCommand(command.value);
        render();
      }
    });
    document.getElementById("btn-help").addEventListener("click", function () { runCommand("help"); });

    document.getElementById("btn-project").addEventListener("click", downloadProject);
    document.getElementById("btn-photo").addEventListener("click", function () { document.getElementById("file-photo").click(); });
    document.getElementById("file-photo").addEventListener("change", function (event) {
      var file = event.target.files[0];
      event.target.value = "";
      if (file) setHeroPhoto(file);
    });
    document.getElementById("btn-export").addEventListener("click", function () {
      download("홈페이지-설정.json", JSON.stringify(files, null, 2), "application/json;charset=utf-8");
    });
    document.getElementById("btn-import").addEventListener("click", function () { document.getElementById("file-import").click(); });
    document.getElementById("file-import").addEventListener("change", function (event) {
      var file = event.target.files[0];
      event.target.value = "";
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var loaded = JSON.parse(reader.result);
          var merged = Object.assign(clone(DEFAULT_FILES), loaded);
          if (!SiteEngine.validate(merged).errors.length) {
            files = merged;
            persist();
            render();
            say("설정을 불러왔습니다.", true);
          } else {
            say("이 파일은 홈페이지 설정이 아니거나 오류가 있습니다.", false);
          }
        } catch (e) {
          say("파일을 읽을 수 없습니다. 이 편집기에서 저장한 설정 파일인지 확인해 주세요.", false);
        }
      };
      reader.readAsText(file);
    });
    document.getElementById("btn-reset").addEventListener("click", function () {
      if (!confirm("지금까지 고친 내용을 모두 지우고 처음 상태로 되돌릴까요?")) return;
      files = clone(DEFAULT_FILES);
      persist();
      render();
      say("처음 상태로 되돌렸습니다.", true);
    });

    render();
  }

  init();
})();

</script>
</body>
</html>
